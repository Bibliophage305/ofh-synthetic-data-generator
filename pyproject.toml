[project]
name = "ofh-synthetic-data-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris", email = "christopher.hampson58@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dataclass-type-validator>=0.1.2",
    "dotenv>=0.9.9",
    "faker>=40.36.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "questionary>=2.1.1",
    "tqdm>=4.70.0",
]

[project.scripts]
ofh-synthetic-data-generator = "ofh_synthetic_data_generator.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
